name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install template-test dependency
        run: python -m pip install -r template-tool/requirements.txt
      - name: HRS contracts, Node checks and generated-document gates
        run: python tools/run_checks.py --contracts-only --evidence "${{ runner.temp }}/hrs-contracts"
      - name: Template style tool contracts
        run: python -m unittest discover -s template-tool/tests -p "test_template_*.py" -v
      - name: Show failing check logs
        if: failure()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'hrs-contracts'
          $result = Join-Path $evidence 'RESULTS.json'
          if (Test-Path $result) {
            $checks = Get-Content $result -Raw | ConvertFrom-Json
            foreach ($check in ($checks.commands | Where-Object status -eq 'FAIL')) {
              Write-Output ('Failed check: ' + $check.name)
              Get-Content (Join-Path $evidence ($check.name + '.log')) -Tail 240
            }
          }
